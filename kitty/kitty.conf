# ─────────────────────────────────────────────
# IMPORT / THEME
# Kitty doesn't use TOML import but you can `include` other files
# Example if you want to reuse your rose-pine theme:
include ./themes/colors.conf
# ─────────────────────────────────────────────

# ─── Shell ───────────────────────────────────
# Default shell
shell /usr/bin/zsh

# ─── Bell ─────────────────────────────────────
# No animation equivalent, but we can disable bell entirely:
disable_audio_bell yes

cursor_trail 3
wayland_enable yes
# ─── Cursor ───────────────────────────────────
# ─── Scrolling ────────────────────────────────
scrollback_lines 10000
scrollback_multiplier 3

# ─── Colors ───────────────────────────────────
background #000000
foreground #ffffff

# Normal colors (only black overridden in your config)
color0 #000000

# ─── Font Settings ────────────────────────────
font_size 14.0
enable_ligatures always

# ─── Window Settings ──────────────────────────
window_padding_width 3 8
dynamic_background_opacity yes
background_opacity 0.35
window_decorations yes
allow_remote_control yes
update_title_in_background yes

# ─── Keybinds ──────────────────────────────────
# Alt+a mapping
map alt+a send_text all \x1ba

# BEGIN_KITTY_FONTS
font_family      family="CaskaydiaCove Nerd Font" style="SemiLight"
bold_font        family="CaskaydiaCove Nerd Font" style="Regular"
italic_font      family="CaskaydiaCove Nerd Font" style="SemiLight Italic"
bold_italic_font family="CaskaydiaCove Nerd Font" style="Italic"
# END_KITTY_FONTS
cursor_shape block
cursor_beam_thickness 1.0
cursor_blink_interval 0
cursor_color #00a86b
cursor_text_color #ff00ff
shell_integration disabled
